<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reservations | Testy Restaurant</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-logo"><i class="fa-solid fa-utensils"></i><h2>TESTY</h2><span>Restaurant Admin</span></div><ul><li onclick="location.href='dashboard.html'"><i class="fa-solid fa-chart-pie"></i> Dashboard</li><li onclick="location.href='menu.html'"><i class="fa-solid fa-bowl-food"></i> Menu</li><li onclick="location.href='orders.html'"><i class="fa-solid fa-cart-shopping"></i> Orders</li><li class="active"><i class="fa-solid fa-calendar-check"></i> Reservations</li></ul></aside><main class="main-content"><header class="topbar"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search reservations..."></div><div class="admin-info"><h4>Administrator</h4><span>Super Admin</span></div></header><section class="welcome"><h1>Reservations</h1><p>Live reservation requests received from the restaurant website.</p></section><div class="food-list"><table><thead><tr><th>Booking</th><th>Guest</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Action</th></tr></thead><tbody id="reservations"></tbody></table></div></main></div><script>
const API='/api';let reservations=[];
async function api(path,options={}){const key=localStorage.getItem('testyAdminKey');if(!key){location.href='login.html?next=reservations.html';throw new Error('Admin authentication required');}const headers={...(options.headers||{}),'X-Admin-Key':key};const r=await fetch(path,{...options,headers});if(r.status===401){localStorage.removeItem('testyAdminKey');location.href='login.html?next=reservations.html';throw new Error('Unauthorized');}return r;}
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadReservations(){const body=document.getElementById('reservations');body.innerHTML='<tr><td colspan="8">Loading reservations...</td></tr>';try{const r=await api(`${API}/reservations`);if(!r.ok)throw new Error();reservations=await r.json();render();}catch(e){if(e.message!=='Admin authentication required'&&e.message!=='Unauthorized')body.innerHTML='<tr><td colspan="8">Unable to load reservations.</td></tr>';}}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const rows=reservations.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('reservations').innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.booking_number)}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${Number(r.guests)}</td><td><span class="status">${esc(r.status)}</span></td><td><select onchange="setStatus(${r.id},this.value)">${['Pending','Confirmed','Rejected','Completed'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="8">No reservations found.</td></tr>'}
async function setStatus(id,status){try{const r=await api(`${API}/reservations/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)throw new Error();const item=reservations.find(x=>x.id===id);if(item)item.status=status;render();}catch(e){alert('Could not update reservation status.');loadReservations();}}
document.getElementById('search').addEventListener('input',render);loadReservations();
</script></body></html>
