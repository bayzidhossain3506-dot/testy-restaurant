<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Menu Management | Testy Restaurant</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-logo"><i class="fa-solid fa-utensils"></i><h2>Testy</h2></div><ul><li onclick="location.href='dashboard.html'">Dashboard</li><li class="active">Menu</li><li onclick="location.href='orders.html'">Orders</li><li onclick="location.href='reservations.html'">Reservations</li></ul></aside><main class="main-content"><div class="topbar"><h1>Menu Management</h1><div class="admin-profile">Administrator</div></div><div class="menu-form"><h2 id="formTitle">Add New Food</h2><form id="foodForm"><div class="form-grid"><input type="text" placeholder="Food Name" id="foodName" required><select id="foodCategory" required></select><input type="number" min="0" step="0.01" placeholder="Price (₹)" id="foodPrice" required><select id="foodStatus"><option>Available</option><option>Unavailable</option></select><input type="url" id="foodImage" placeholder="Image URL (optional)"></div><textarea id="foodDescription" placeholder="Food Description"></textarea><button type="submit" class="admin-btn" id="submitBtn">Add Food</button><button type="button" id="cancelEdit" hidden>Cancel Edit</button></form></div><div class="food-list"><div class="section-header"><h2>Categories</h2><button class="view-all-btn" id="addCategory">+ Add Category</button></div><div id="categoryList" style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 25px"></div><h2>Food Menu</h2><table><thead><tr><th>Image</th><th>Food Name</th><th>Category</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody id="foodTableBody"></tbody></table></div></main></div><script>
const API='/api';let items=[],categories=[],editingId=null;
async function api(path,options={}){const key=localStorage.getItem('testyAdminKey');if(!key){location.href='login.html?next=menu.html';throw new Error('Admin authentication required');}const headers={...(options.headers||{}),'X-Admin-Key':key};const r=await fetch(path,{...options,headers});if(r.status===401){localStorage.removeItem('testyAdminKey');location.href='login.html?next=menu.html';throw new Error('Unauthorized');}return r;}
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadData(){try{const [m,c]=await Promise.all([api(`${API}/admin/menu`),api(`${API}/admin/categories`)]);if(!m.ok||!c.ok)throw new Error();items=await m.json();categories=await c.json();renderCategories();render();}catch(e){if(!['Admin authentication required','Unauthorized'].includes(e.message))document.getElementById('foodTableBody').innerHTML='<tr><td colspan="6">Unable to load menu.</td></tr>';}}
function renderCategories(){const select=document.getElementById('foodCategory'),current=select.value;select.innerHTML=categories.filter(c=>c.active).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');if(current&&categories.some(c=>c.name===current&&c.active))select.value=current;document.getElementById('categoryList').innerHTML=categories.map(c=>`<span style="padding:7px 10px;border:1px solid #ddd;border-radius:16px;opacity:${c.active?1:.5}">${esc(c.name)} <button type="button" onclick="renameCategory(${c.id},'${esc(c.name).replace(/'/g,"\\'")}')">✎</button> <button type="button" onclick="toggleCategory(${c.id},${!c.active})">${c.active?'Disable':'Enable'}</button></span>`).join('');}
function render(){document.getElementById('foodTableBody').innerHTML=items.length?items.map(i=>`<tr><td>${i.image?`<img src="${esc(i.image)}" class="food-img" alt="${esc(i.name)}">`:'—'}</td><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td>₹${Number(i.price).toFixed(2)}</td><td><span class="status">${esc(i.status)}</span></td><td><button onclick="editItem(${i.id})">Edit</button> <button class="delete-btn" onclick="deleteItem(${i.id})">Delete</button></td></tr>`).join(''):'<tr><td colspan="6">No menu items found.</td></tr>'}
function editItem(id){const i=items.find(x=>x.id===id);if(!i)return;editingId=id;foodName.value=i.name;foodCategory.value=i.category;foodPrice.value=i.price;foodStatus.value=i.status;foodImage.value=i.image||'';foodDescription.value=i.description||'';formTitle.textContent='Edit Food';submitBtn.textContent='Save Changes';cancelEdit.hidden=false;window.scrollTo({top:0,behavior:'smooth'});}
function resetEdit(){editingId=null;foodForm.reset();formTitle.textContent='Add New Food';submitBtn.textContent='Add Food';cancelEdit.hidden=true;renderCategories();}
foodForm.addEventListener('submit',async e=>{e.preventDefault();const payload={name:foodName.value.trim(),category:foodCategory.value,price:Number(foodPrice.value),status:foodStatus.value,image:foodImage.value.trim(),description:foodDescription.value.trim()};try{const r=await api(editingId?`${API}/menu/${editingId}`:`${API}/menu`,{method:editingId?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error();const saved=await r.json();if(editingId)items=items.map(i=>i.id===editingId?saved:i);else items.unshift(saved);render();resetEdit();}catch(e){alert('Could not save menu item.');}});
cancelEdit.onclick=resetEdit;async function deleteItem(id){if(!confirm('Delete this food item?'))return;try{const r=await api(`${API}/menu/${id}`,{method:'DELETE'});if(!r.ok)throw new Error();items=items.filter(i=>i.id!==id);render();}catch(e){alert('Could not delete menu item.');}}
document.getElementById('addCategory').onclick=async()=>{const name=prompt('New category name:');if(!name?.trim())return;try{const r=await api(`${API}/categories`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not add category');categories.push(data);renderCategories();}catch(e){alert(e.message);}};
async function renameCategory(id,current){const name=prompt('Category name:',current);if(!name?.trim()||name.trim()===current)return;try{const r=await api(`${API}/categories/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not rename category');categories=categories.map(c=>c.id===id?data:c);items=items.map(i=>i.category===current?{...i,category:data.name}:i);renderCategories();render();}catch(e){alert(e.message);}}
async function toggleCategory(id,active){try{const r=await api(`${API}/categories/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not update category');categories=categories.map(c=>c.id===id?data:c);renderCategories();}catch(e){alert(e.message);}}
loadData();
</script></body></html>
