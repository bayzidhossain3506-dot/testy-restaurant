<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Testy Restaurant</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"></head><body><div class="admin-container"><div class="admin-box"><div class="logo"><i class="fa-solid fa-utensils"></i><h2>Testy Restaurant</h2><span>Admin Panel</span></div><h3>Administrator Login</h3><p>Sign in to securely access the restaurant dashboard.</p><form id="adminLoginForm"><div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="adminEmail" placeholder="Admin Email" required></div><div class="input-box"><i class="fa-solid fa-key"></i><input type="password" id="adminKey" placeholder="Admin Access Key" required><i class="fa-solid fa-eye toggle-password" id="toggleAdminKey"></i></div><button type="submit" class="admin-btn" id="adminLoginBtn">Login to Dashboard</button><p id="loginError" role="alert" style="display:none"></p></form><a href="../index.html" class="back-home">← Back to Website</a></div></div><script>
const API='/api';const form=document.getElementById('adminLoginForm'),keyInput=document.getElementById('adminKey'),emailInput=document.getElementById('adminEmail'),error=document.getElementById('loginError'),button=document.getElementById('adminLoginBtn');document.getElementById('toggleAdminKey').onclick=()=>keyInput.type=keyInput.type==='password'?'text':'password';form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';button.disabled=true;button.textContent='Signing in...';try{const r=await fetch(`${API}/admin/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value.trim(),key:keyInput.value})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.success)throw new Error(data.message||'Invalid admin credentials');localStorage.setItem('testyAdminKey',keyInput.value);localStorage.setItem('adminEmail',emailInput.value.trim());localStorage.setItem('userRole','admin');const next=new URLSearchParams(location.search).get('next');location.href=next&&/^[a-zA-Z0-9_-]+\.html$/.test(next)?next:'dashboard.html';}catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='Login to Dashboard';}});
</script></body></html>
