<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Orders | Testy Restaurant</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-logo"><i class="fa-solid fa-utensils"></i><h2>TESTY</h2><span>Restaurant Admin</span></div><ul><li onclick="location.href='dashboard.html'"><i class="fa-solid fa-chart-pie"></i> Dashboard</li><li onclick="location.href='menu.html'"><i class="fa-solid fa-bowl-food"></i> Menu</li><li class="active"><i class="fa-solid fa-cart-shopping"></i> Orders</li><li onclick="location.href='reservations.html'"><i class="fa-solid fa-calendar-check"></i> Reservations</li></ul></aside><main class="main-content"><header class="topbar"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search orders..."></div><div class="admin-info"><h4>Administrator</h4><span>Super Admin</span></div></header><section class="welcome"><h1>Orders</h1><p>Live orders received from the restaurant website.</p></section><div class="food-list"><table><thead><tr><th>Order</th><th>Customer</th><th>Type / Payment</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></main></div><script>
const API='/api';const STATUSES=['Pending','Confirmed','Preparing','Ready','Out for Delivery','Completed','Cancelled'];let orders=[];
async function api(path,options={}){const key=localStorage.getItem('testyAdminKey');if(!key){location.href='login.html?next=orders.html';throw new Error('Admin authentication required');}const headers={...(options.headers||{}),'X-Admin-Key':key};const r=await fetch(path,{...options,headers});if(r.status===401){localStorage.removeItem('testyAdminKey');location.href='login.html?next=orders.html';throw new Error('Unauthorized');}return r;}
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadOrders(){const body=document.getElementById('orders');body.innerHTML='<tr><td colspan="7">Loading orders...</td></tr>';try{const r=await api(`${API}/orders`);if(!r.ok)throw new Error();orders=await r.json();render();}catch(e){if(e.message!=='Admin authentication required'&&e.message!=='Unauthorized')body.innerHTML='<tr><td colspan="7">Unable to load orders.</td></tr>';}}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const rows=orders.filter(o=>JSON.stringify(o).toLowerCase().includes(q));document.getElementById('orders').innerHTML=rows.length?rows.map(o=>`<tr><td><strong>${esc(o.order_number)}</strong><br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${esc(o.customer_name)}<br><small>${esc(o.phone)}</small><br><small>${esc(o.address)}</small></td><td>${esc(o.order_type||'Delivery')}<br><small>${esc(o.payment_method)}</small></td><td>${(o.items||[]).map(x=>`${esc(x.name)} × ${Number(x.quantity||1)}`).join('<br>')||'-'}</td><td>₹${Number(o.total||0).toFixed(2)}<br><small>Delivery ₹${Number(o.delivery_fee||0).toFixed(2)}</small></td><td><span class="status">${esc(o.status)}</span></td><td><select onchange="setStatus(${o.id},this.value)">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td colspan="7">No orders found.</td></tr>'}
async function setStatus(id,status){try{const r=await api(`${API}/orders/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)throw new Error();const o=orders.find(x=>x.id===id);if(o)o.status=status;render();}catch(e){alert('Could not update order status.');loadOrders();}}
document.getElementById('search').addEventListener('input',render);loadOrders();
</script></body></html>
