<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Track Order | Testy Restaurant</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body class="premium-page"><nav class="navbar"><div class="logo">Testy Restaurant</div><div class="menu-toggle">☰</div><ul class="menu"><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a class="active" href="order.html">Track Order</a></li><li><a href="about.html">About</a></li><li><a href="gallery.html">Gallery</a></li><li><a href="contact.html">Contact</a></li></ul><div class="cart-icon">🛒 <span id="cartCount">0</span></div><a href="reservation.html" class="btn">Book Table</a></nav><section class="premium-hero"><div class="premium-hero-content"><div class="premium-label">Testy Restaurant</div><h1>Track Your <span>Order</span></h1><p>Follow your order from our kitchen to your doorstep.</p></div></section><section class="premium-section"><div id="orderBox" class="checkout-panel" style="max-width:850px;margin:auto;text-align:center">Loading your order...</div></section><script>const API_URL=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:5000/api':'/api';const params=new URLSearchParams(location.search),requested=params.get('id'),saved=JSON.parse(localStorage.getItem('testyLastOrder')||'null'),orderNumber=requested||saved?.order_number;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(o){const states=['Pending','Confirmed','Preparing','Ready','Completed'],current=Math.max(0,states.indexOf(o.status));const items=(o.items||[]).map(i=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333"><span>${esc(i.name)} × ${Number(i.quantity||1)}</span><strong>₹${(Number(i.price||0)*Number(i.quantity||1)).toFixed(2)}</strong></div>`).join('');document.getElementById('orderBox').innerHTML=`<p style="color:#c9a227">ORDER NUMBER</p><h2>${esc(o.order_number)}</h2><h3 style="margin-top:25px">${esc(o.status)}</h3><div style="display:flex;justify-content:space-between;margin:35px 0;gap:8px">${states.map((s,i)=>`<div style="flex:1"><div style="width:35px;height:35px;border-radius:50%;margin:auto;padding-top:8px;background:${i<=current?'#c9a227':'#444'};color:#111">${i+1}</div><small>${s}</small></div>`).join('')}</div><div style="text-align:left;margin-top:30px">${items}</div><div style="display:flex;justify-content:space-between;margin-top:20px"><span>Total</span><strong>₹${Number(o.total||0).toFixed(2)}</strong></div><p style="margin-top:25px;color:#aaa">Payment: Pay when your order is delivered or at the restaurant.</p>`}async function load(){if(!orderNumber){document.getElementById('orderBox').innerHTML='<h2>No order found</h2><p>Place an order first to track it.</p><br><a href="menu.html" class="gold-btn">Browse Menu</a>';return}try{const r=await fetch(`${API_URL}/orders/${encodeURIComponent(orderNumber)}`);if(!r.ok)throw Error(r.status===404?'not-found':'server');render(await r.json())}catch(e){document.getElementById('orderBox').innerHTML=e.message==='not-found'?'<h2>Order not found</h2><p>Check your order number and try again.</p>':'<h2>Unable to load order</h2><p>Please try again in a moment.</p>'}}load();setInterval(load,10000);document.getElementById('cartCount').textContent=JSON.parse(localStorage.getItem('testyCart')||'[]').reduce((n,i)=>n+Number(i.quantity||1),0);</script><script src="assets/js/script.js"></script></body></html>
