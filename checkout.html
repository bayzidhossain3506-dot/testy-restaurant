<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Testy Restaurant</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="premium-page"><nav class="navbar"><div class="logo">Testy Restaurant</div><ul class="menu"><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a class="active" href="order.html">Orders</a></li><li><a href="about.html">About</a></li><li><a href="gallery.html">Gallery</a></li><li><a href="contact.html">Contact</a></li></ul><div class="cart-icon">🛒 <span id="cartCount">0</span></div><a href="reservation.html" class="btn">Book Table</a></nav><section class="premium-hero"><div class="premium-hero-content"><div class="premium-label">Almost There</div><h1>Your <span>Checkout</span></h1><p>Choose delivery or pickup and pay when you receive your order.</p></div></section><section class="premium-section"><div class="checkout-layout"><div class="checkout-panel"><h2>Your Order</h2><div id="checkoutItems"></div></div><div class="checkout-panel checkout-summary"><h2>Order Summary</h2><div class="summary-row"><span>Subtotal</span><span>₹<span id="subtotal">0.00</span></span></div><div class="summary-row"><span>Delivery</span><span>₹<span id="deliveryFee">0.00</span></span></div><div class="summary-total"><span>Total</span><span>₹<span id="total">0.00</span></span></div><br><h2>Order Details</h2><form id="checkoutForm"><input class="premium-input" id="name" type="text" maxlength="100" placeholder="Full Name" autocomplete="name" required><input class="premium-input" id="phone" type="tel" maxlength="20" placeholder="Phone Number" autocomplete="tel" pattern="[0-9+ ()-]{7,20}" required><input class="premium-input" id="email" type="email" maxlength="150" placeholder="Email Address (optional)" autocomplete="email"><label for="orderType">Order Type</label><select class="premium-input" id="orderType" required><option value="Delivery">🛵 Delivery</option><option value="Pickup">🏪 Pickup</option></select><textarea class="premium-input" id="address" maxlength="500" placeholder="Delivery Address / Hostel & Room" autocomplete="street-address" required></textarea><select class="premium-input" id="payment" required><option value="Cash on Delivery">Cash on Delivery</option><option value="Pay at Restaurant">Pay at Restaurant / Pickup</option></select><p id="orderInfo" style="margin:10px 0;opacity:.8"></p><p id="formError" style="display:none;margin:12px 0;color:#e57373"></p><button class="gold-btn" id="placeOrderBtn" type="submit" style="width:100%;">Place Order</button></form></div></div></section><script>const API_URL=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:5000/api':'/api';let cart=JSON.parse(localStorage.getItem('testyCart')||'[]').map(i=>({...i,quantity:Number(i.quantity??i.qty??1)})).filter(i=>i.id&&i.quantity>0);let settings={delivery_fee:49,free_delivery_above:499,minimum_order:0,is_open:true};const saveCart=()=>localStorage.setItem('testyCart',JSON.stringify(cart));const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function loadSettings(){try{const r=await fetch(`${API_URL}/settings`);if(r.ok)settings=await r.json();}catch{ }renderCheckout()}function renderCheckout(){const box=document.getElementById('checkoutItems');document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.quantity,0);if(!cart.length){box.innerHTML='<div style="text-align:center;padding:50px 0"><h3>Your cart is empty.</h3><br><a href="menu.html" class="gold-btn">Browse Menu</a></div>';document.getElementById('placeOrderBtn').disabled=true;return}let subtotal=0;box.innerHTML=cart.map((item,index)=>{const price=Number(item.price)||0,t=price*item.quantity;subtotal+=t;return `<div class="checkout-item"><div><h3>${esc(item.name)}</h3><p>₹${price.toFixed(2)} × ${item.quantity}</p><div><button type="button" onclick="changeQty(${index},-1)">−</button> <strong>${item.quantity}</strong> <button type="button" onclick="changeQty(${index},1)">+</button></div></div><div><strong style="color:#f3d675">₹${t.toFixed(2)}</strong><br><button type="button" onclick="removeItem(${index})">Remove</button></div></div>`}).join('');const type=document.getElementById('orderType').value;const fee=type==='Pickup'?0:(subtotal>=Number(settings.free_delivery_above)?0:Number(settings.delivery_fee));document.getElementById('subtotal').textContent=subtotal.toFixed(2);document.getElementById('deliveryFee').textContent=fee.toFixed(2);document.getElementById('total').textContent=(subtotal+fee).toFixed(2);document.getElementById('address').required=type==='Delivery';document.getElementById('address').placeholder=type==='Delivery'?'Delivery Address / Hostel & Room':'Pickup note (optional)';document.getElementById('payment').value=type==='Pickup'?'Pay at Restaurant':'Cash on Delivery';document.getElementById('payment').disabled=true;document.getElementById('orderInfo').textContent=type==='Pickup'?'Pickup orders have no delivery fee. Pay at the restaurant when you collect your order.':Number(settings.free_delivery_above)>0?`Delivery is ₹${Number(settings.delivery_fee).toFixed(2)}. Free delivery on orders ₹${Number(settings.free_delivery_above).toFixed(2)} or more.`:'';if(!settings.is_open){document.getElementById('orderInfo').textContent='The restaurant is currently closed. Please try again during opening hours.';document.getElementById('placeOrderBtn').disabled=true}}function changeQty(i,d){if(!cart[i])return;cart[i].quantity=Math.min(20,Math.max(1,cart[i].quantity+d));saveCart();renderCheckout()}function removeItem(i){cart.splice(i,1);saveCart();renderCheckout()}document.getElementById('orderType').addEventListener('change',renderCheckout);document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();if(!cart.length)return;const error=document.getElementById('formError'),button=document.getElementById('placeOrderBtn');error.style.display='none';button.disabled=true;button.textContent='Placing Order...';const type=document.getElementById('orderType').value;const customer={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),address:document.getElementById('address').value.trim()||'Pickup at restaurant'};try{const r=await fetch(`${API_URL}/orders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer,items:cart.map(i=>({id:i.id,quantity:i.quantity})),order_type:type,payment_method:type==='Pickup'?'Pay at Restaurant':'Cash on Delivery'})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Unable to place order');localStorage.setItem('testyLastOrder',JSON.stringify({...data,customer}));localStorage.removeItem('testyCart');location.href=`order.html?id=${encodeURIComponent(data.order_number)}`}catch(err){error.textContent=err.message;error.style.display='block';button.disabled=false;button.textContent='Place Order'}});renderCheckout();loadSettings();</script><script src="assets/js/script.js"></script></body></html>
